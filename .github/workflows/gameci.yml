name: GameCI

on:
  push:
    branches:
      - main
  pull_request_target:
  workflow_dispatch:

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.fork && 'external' || '' }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: ci_checkout
          lfs: true
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.fork }}

      - name: Prepare project
        run: |
          mv ci_checkout/.github/unity/unity-2022.3.22f1/* . && \
          mkdir -p Packages/dev.limitex.avatar-compressor && \
          mv ci_checkout/* Packages/dev.limitex.avatar-compressor/ && \
          rm -rf ci_checkout

      - name: Setup vrc-get
        uses: anatawa12/sh-actions/setup-vrc-get@master

      - name: Resolve VPM packages
        uses: anatawa12/sh-actions/resolve-vpm-packages@master
        with:
          repos: |
            https://vpm.limitex.dev/
            https://vpm.nadena.dev/vpm.json
            https://lilxyzw.github.io/vpm-repos/vpm.json
      
      - name: Cache Library
        if: ${{ github.event_name != 'pull_request_target' || !github.event.pull_request.head.repo.fork }}
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-full-${{ hashFiles('Packages/**') }}
          restore-keys: Library-full-

      - name: Restore Library cache (fork PR)
        if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.fork }}
        uses: actions/cache/restore@v5
        with:
          path: Library
          key: Library-full-${{ hashFiles('Packages/**') }}
          restore-keys: Library-full-
            
      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        id: gameci
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          coverageOptions: generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+dev.limitex.*
          customParameters: -assemblyNames dev.limitex.avatar-compressor.editor.tests
        
      - uses: actions/upload-artifact@v7
        if: ${{ always() && steps.gameci.outputs.artifactsPath != '' }}
        with:
          name: Test results
          path: ${{ steps.gameci.outputs.artifactsPath }}
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: ${{ always() && steps.gameci.outputs.coveragePath != '' }}
        with:
          name: Coverage results
          path: ${{ steps.gameci.outputs.coveragePath }}
          if-no-files-found: ignore
